        .install-prompt { position: fixed; bottom: 20px; left: 20px; right: 20px; background: linear-gradient(135deg, #1e4a3b, #0f3b2f); color: white; padding: 1rem; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; z-index: 2000; animation: slideUp 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }

        @keyframes slideUpCard { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-card h2 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #1e4a3b, #2c7a5e, #5bc0a3); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; margin-bottom: 1.5rem; }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 74, 59, 0.3); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .portal-sidebar { width: 280px; background: linear-gradient(180deg, #0a221d 0%, #0c2b25 100%); color: white; padding: 1.5rem; position: sticky; top: 0; height: 100vh; transition: all 0.3s; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; z-index: 1000; }

        .sidebar-logo-text h2 { font-size: 1.1rem; font-weight: 700; }

        .referral-code-box { background: #f8fbf9; border-radius: 16px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border: 2px solid #e2edeb; transition: all 0.3s; }

        .copy-btn { background: linear-gradient(135deg, #1e4a3b, #0f3b2f); color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }

        .share-fb { background: #1877f2; color: white; }

        .stats-grid-referral { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card-referral { background: white; padding: 1.2rem; border-radius: 20px; text-align: center; transition: all 0.3s; border: 1px solid rgba(44, 122, 94, 0.1); }
        .stat-card-referral:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        .statement-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .summary-card { background: white; border-radius: 20px; padding: 1.2rem; text-align: center; transition: all 0.3s; cursor: pointer; border: 1px solid rgba(44, 122, 94, 0.1); animation: scaleIn 0.3s ease backwards; }
        .summary-card:nth-child(1) { animation-delay: 0.05s; }
        .summary-card:nth-child(2) { animation-delay: 0.1s; }
        .summary-card:nth-child(3) { animation-delay: 0.15s; }

        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

</head>
<body>
<div id="app"></div>
<div id="installContainer"></div>

<script>
    // ==================== PWA INSTALL PROMPT ====================
    let deferredPrompt = null;
    let isOnline = navigator.onLine;

    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; showInstallPrompt(); });

    function showInstallPrompt() {
        const installContainer = document.getElementById('installContainer');
        if(!installContainer || localStorage.getItem('installPromptDismissed')) return;
        installContainer.innerHTML = `<div class="install-prompt"><div><i class="fas fa-download"></i> <strong>Install JamiiSim App</strong><p style="font-size:0.7rem;">Install for faster access</p></div><div style="display:flex;gap:10px;"><button id="installAppBtn">Install</button><button id="dismissInstallBtn" style="background:rgba(255,255,255,0.2);">Later</button></div></div>`;
        document.getElementById('installAppBtn')?.addEventListener('click', async () => { if(deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; } installContainer.innerHTML = ''; localStorage.setItem('installPromptDismissed','true'); });
        document.getElementById('dismissInstallBtn')?.addEventListener('click', () => { installContainer.innerHTML = ''; localStorage.setItem('installPromptDismissed','true'); });
    }

    function updateOnlineStatus() { isOnline = navigator.onLine; const statusDiv = document.getElementById('onlineStatus'); if(statusDiv) { statusDiv.className = `online-status ${isOnline ? '' : 'offline-status'}`; statusDiv.innerHTML = isOnline ? '<i class="fas fa-wifi"></i> Online' : '<i class="fas fa-wifi-slash"></i> Offline'; } if(!isOnline) showToast("Offline mode - using cached data"); else syncPendingData(); }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    async function syncPendingData() {
        const pending = JSON.parse(localStorage.getItem('pendingTransfers') || '[]');

        <div class="table-wrapper" style="margin-top:1rem;"><table class="data-table"><thead><tr><th>Till Number</th><th>Store Number</th><th>Units</th><th>Status</th></tr></thead><tbody>${customerTills.map(t => `<tr><td><strong>${escapeHtml(t.tillNumber)}</strong></td><td>${escapeHtml(t.storeNumber)}</div><td>${t.units || 0}</div><td>${t.status === "active" ? "Active" : "Inactive"}</div></tr>`).join('')}</tbody></table></div>
        <button class="btn" id="downloadStatementBtn" style="margin-top:1.5rem;"><i class="fas fa-download"></i> Download Full Statement (PDF)</button>`;
    }
    
    async function handleTransferIn() {
        const tillSelect = document.getElementById("transferTill");
        const opt = tillSelect.options[tillSelect.selectedIndex];
        const tillNumber = tillSelect.value, rowIndex = opt?.dataset.row, currentUnits = parseInt(opt?.dataset.currentUnits||0);
        const senderPhone = document.getElementById("senderPhone").value.trim(), units = parseInt(document.getElementById("transferUnits").value), reason = document.getElementById("transferReason")?.value.trim() || "Top-up";
        const feedback = document.getElementById("transferFeedback");
        if(!tillNumber || !units || units<=0) { feedback.style.display="block"; feedback.innerHTML='<i class="fas fa-exclamation-circle"></i> Please select till and valid units'; feedback.className="feedback-message feedback-error"; return; }
        feedback.style.display="block"; feedback.innerHTML='<i class="fas fa-spinner fa-pulse"></i> Processing...'; feedback.className="feedback-message";
        
        if(!isOnline) {
            const pending = JSON.parse(localStorage.getItem('pendingTransfers')||'[]');
            pending.push({id:Date.now(), rowIndex, units, tillNumber});
            localStorage.setItem('pendingTransfers', JSON.stringify(pending));
            const idx = customerTills.findIndex(t=>t.tillNumber===tillNumber); if(idx!==-1) customerTills[idx].units += units;
            transferHistory.unshift({id:Date.now(), tillNumber, fromPhone:senderPhone, units, reason, date:new Date().toISOString(), pending:true});
            localStorage.setItem(`transfers_in_${currentCustomer.phone}`, JSON.stringify(transferHistory));
            totalUnitsReceived+=units; transactionCount=transferHistory.length;
            feedback.innerHTML=`<i class="fas fa-check-circle"></i> Added ${units} units (Offline) - Will sync when online`; feedback.className="feedback-message feedback-success";
            document.getElementById("transferUnits").value=""; renderDashboard(); return;
        }
        
        const res = await apiCall("updateUnits", { rowIndex: parseInt(rowIndex), addUnits: units });
        if(res.success) {
            const idx = customerTills.findIndex(t=>t.tillNumber===tillNumber); if(idx!==-1) customerTills[idx].units += units;
            transferHistory.unshift({id:Date.now(), tillNumber, fromPhone:senderPhone, units, reason, date:new Date().toISOString()});
            localStorage.setItem(`transfers_in_${currentCustomer.phone}`, JSON.stringify(transferHistory));
            if(customerTelegramId) await notifyTransfer(tillNumber, units, currentUnits+units);
            totalUnitsReceived+=units; transactionCount=transferHistory.length;
            feedback.innerHTML=`<i class="fas fa-check-circle"></i> Success! Added ${units} units. New balance: ${currentUnits+units} units`; feedback.className="feedback-message feedback-success";
            document.getElementById("transferUnits").value=""; showToast(`Added ${units} units successfully!`); renderDashboard();
        } else { feedback.innerHTML=`<i class="fas fa-exclamation-circle"></i> Failed: ${res.error}`; feedback.className="feedback-message feedback-error"; }
    }
    
    async function handleSaveTelegram() {
        const username = document.getElementById("telegramUsername").value.trim();
        if(!username) { showToast("Enter your Telegram username", true); return; }
        const clean = username.replace('@','');
        showToast("Verifying Telegram connection...");
        const result = await getChatIdFromUsername(clean);
        if(result.success) {
            saveTelegramUsername(clean, result.chatId);
            await sendTelegramMessage(result.chatId, `🎉 Welcome to JamiiSim, ${currentCustomer.name}! You'll now receive real-time notifications about transfers and account activity.`);
            showToast(`✅ Connected to @${clean}! Test message sent.`);
            renderDashboard();
        } else { showToast(`❌ Send a message to @${TELEGRAM_BOT_USERNAME} on Telegram first, then try again.`, true); }
    }
    
    function downloadStatement() {
        const totalUnits = customerTills.reduce((s,t)=>s+(t.units||0),0);
        let html = `<html><head><title>Statement - ${currentCustomer.name}</title><style>body{font-family:Arial;padding:2rem;}h1{color:#1e4a3b;}table{width:100%;border-collapse:collapse;margin:1rem 0;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#1e4a3b;color:white;}</style></head><body><h1>JamiiSim Network - Account Statement</h1><p><strong>Name:</strong> ${currentCustomer.name}</p><p><strong>Phone:</strong> ${currentCustomer.phone}</p><p><strong>ID:</strong> ${currentCustomer.idNumber}</p><p><strong>Date:</strong> ${new Date().toLocaleString()}</p><h3>Summary</h3><p>Total Tills: ${customerTills.length} | Current Units: ${totalUnits} | Active Tills: ${customerTills.filter(t=>t.status==="active").length}</p><p>Referrals: ${referralStats.invited} | Bonus Units Earned: ${referralStats.earnings}</p><h3>Till Details</h3></table><th>Till Number</th><th>Store Number</th><th>Units</th><th>Status</th></tr>${customerTills.map(t=>`<tr><td>${t.tillNumber}</td><td>${t.storeNumber}</td><td>${t.units||0}</td><td>${t.status}</td></tr>`).join('')}</table><h3>Transaction History</h3><table border="1"><tr><th>Date</th><th>From</th><th>Units</th><th>Reason</th></tr>${transferHistory.map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td>${t.fromPhone}</td><td>+${t.units}</td><td>${t.reason}</div></tr>`).join('')}</table><h3>Referral History</h3><table><th>Name</th><th>Phone</th><th>Date</th><th>Bonus</th></tr>${JSON.parse(localStorage.getItem('all_referrals')||'[]').filter(r=>r.referrer===currentCustomer.phone).map(r=>`<tr><td>${r.invitedName}</td><td>${r.invited}</td><td>${new Date(r.date).toLocaleDateString()}</td><td>+${r.bonus}</td></tr>`).join('')}</table><p style="margin-top:2rem;text-align:center;">Generated by JamiiSim Network</p></body></html>`;
        const blob = new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`JamiiSim_Statement_${currentCustomer.phone}_${Date.now()}.html`; a.click(); URL.revokeObjectURL(blob); showToast("Statement downloaded!");
    }
    
    function initMobileMenu() {
        const existing = document.querySelector('.mobile-menu-toggle'); if(existing) existing.remove();
        const toggle = document.createElement('button'); toggle.className='mobile-menu-toggle'; toggle.innerHTML='<i class="fas fa-bars"></i>';
        toggle.onclick = () => { const sidebar=document.querySelector('.portal-sidebar'), overlay=document.querySelector('.mobile-overlay'); if(mobileMenuOpen) { sidebar?.classList.remove('open'); overlay?.classList.remove('show'); toggle.innerHTML='<i class="fas fa-bars"></i>'; mobileMenuOpen=false; } else { sidebar?.classList.add('open'); overlay?.classList.add('show'); toggle.innerHTML='<i class="fas fa-times"></i>'; mobileMenuOpen=true; } };
        document.body.appendChild(toggle);
        const overlay = document.createElement('div'); overlay.className='mobile-overlay'; overlay.onclick=()=>{ document.querySelector('.portal-sidebar')?.classList.remove('open'); overlay.classList.remove('show'); document.querySelector('.mobile-menu-toggle').innerHTML='<i class="fas fa-bars"></i>'; mobileMenuOpen=false; };
        document.body.appendChild(overlay);
    }
    
    function switchTab(tab) { currentTab=tab; document.querySelectorAll('[id$="Content"]').forEach(el=>el.style.display='none'); document.getElementById(`${tab}Content`).style.display='block'; document.querySelectorAll('.nav-btn').forEach(btn=>{ if(btn.dataset.tab===tab) btn.classList.add('active'); else btn.classList.remove('active'); }); if(window.innerWidth<=768){ document.querySelector('.portal-sidebar')?.classList.remove('open'); document.querySelector('.mobile-overlay')?.classList.remove('show'); document.querySelector('.mobile-menu-toggle').innerHTML='<i class="fas fa-bars"></i>'; mobileMenuOpen=false; } }
    
    function handleLogout() { isLoggingOut=true; currentCustomer=null; customerTills=[]; transferHistory=[]; customerTelegramId=null; customerTelegramUsername=null; showToast("Logged out"); renderLogin(); document.getElementById("loginBtn")?.addEventListener("click", handleLogin); }
    
    function render() { const app=document.getElementById("app"); if(currentCustomer && !isLoggingOut) renderDashboard(); else { isLoggingOut=false; app.innerHTML=renderLogin(); document.getElementById("loginBtn")?.addEventListener("click", handleLogin); } }
    
    updateOnlineStatus();
    render();
</script>
</body>
