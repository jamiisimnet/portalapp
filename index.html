<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="theme-color" content="#1e4a3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JamiiSim">
    <meta name="application-name" content="JamiiSim">

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e4a3b'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3E⚡%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    
    <title>JamiiSim - Customer Portal PWA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Install Prompt */
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, #1e4a3b, #0f3b2f);
            color: white;
            padding: 1rem;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .install-prompt button {
            background: white;
            color: #1e4a3b;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Online Status */
        .online-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2b7e5a;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            z-index: 1000;
        }

        .offline-status {
            background: #c2410c;
        }

        /* Login Container */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b2b26 0%, #1e4a3b 50%, #2c7a5e 100%);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: slideUpCard 0.6s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUpCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e4a3b, #2c7a5e, #5bc0a3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e4a3b;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2edeb;
            border-radius: 30px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #2c7a5e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 122, 94, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #1e4a3b, #0f3b2f);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 74, 59, 0.3);
        }

        /* Customer Portal Dashboard */
        .customer-portal {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        /* Mobile Menu */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: linear-gradient(135deg, #1e4a3b, #0f3b2f);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            align-items: center;
            justify-content: center;
        }

        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Sidebar */
        .portal-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0a221d 0%, #0c2b25 100%);
            color: white;
            padding: 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            transition: all 0.3s;
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;

        @media (max-width: 768px) {
            .portal-sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
            }
            .portal-sidebar.open {

                box-shadow: 4px 0 20px rgba(0,0,0,0.3);
            }
            .mobile-menu-toggle {
                display: flex;
            }
            .mobile-overlay.show {

                width: 100%;

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(255,255,255,0.05);

        .sidebar-logo-icon {

        .sidebar-footer button {
            background: transparent;
            border: none;
            color: #b8cdc5;
            width: 100%;
            text-align: left;

            border-radius: 12px;

            display: flex;
            align-items: center;

        }

        .sidebar-footer button:hover {

        /* Main Content */
        .portal-main {
            flex: 1;
            overflow-y: auto;
        }

        .portal-header {
            background: linear-gradient(135deg, #1e4a3b, #0f3b2f);

        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .welcome-section h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }

        .welcome-section p {
            font-size: 0.75rem;

        }

        .customer-profile-card {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 50px;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #5bc0a3, #2c7a5e);
            border-radius: 50%;

            align-items: center;

        }

        .profile-avatar i {

        }

        .profile-details h3 {

        .profile-details p {

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));

        .stat-label {

        /* Content Area */
        .content-area {
            padding: 1rem 1.5rem 1.5rem;

        /* Tables */

        .data-table th {

        /* Badges */
        .badge-active {

        .badge-inactive {

        .badge-incoming {

        /* Telegram Card */
        .telegram-card {
            background: linear-gradient(135deg, #1e4a3b, #0f3b2f);
            border-radius: 20px;
            padding: 1.5rem;

        .telegram-card h3 {
            font-size: 1.1rem;

        .telegram-card p {

        .telegram-input-group {

        .telegram-input-group input {

        .btn-telegram {
            background: #0088cc;

            border: none;

            border-radius: 30px;

        .btn-telegram:hover {

        .telegram-status {

        .status-connected {

        }

        .status-disconnected {

        /* Transfer Form */
        .transfer-form {
            max-width: 500px;

        }

        .transfer-form h3 {

        .transfer-form select,

<body>
<div id="app"></div>
<div id="installContainer"></div>

<script>
    // ==================== PWA INSTALL PROMPT ====================
    let deferredPrompt = null;
    let isOnline = navigator.onLine;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallPrompt();
    });

    function showInstallPrompt() {
        const installContainer = document.getElementById('installContainer');
        if (!installContainer) return;
        
        if (localStorage.getItem('installPromptDismissed')) return;
        
        installContainer.innerHTML = `
            <div class="install-prompt">
                <div>
                    <i class="fas fa-download"></i> <strong>Install JamiiSim App</strong>
                    <p style="font-size: 0.7rem; margin-top: 4px;">Install for faster access and offline use</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="installAppBtn">Install</button>
                    <button id="dismissInstallBtn" style="background: rgba(255,255,255,0.2); color: white;">Later</button>
                </div>
            </div>
        `;
        
        document.getElementById('installAppBtn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
            installContainer.innerHTML = '';
            localStorage.setItem('installPromptDismissed', 'true');
        });
        
        document.getElementById('dismissInstallBtn')?.addEventListener('click', () => {
            installContainer.innerHTML = '';
            localStorage.setItem('installPromptDismissed', 'true');
        });
    }

    // Online/Offline detection
    function updateOnlineStatus() {
        isOnline = navigator.onLine;
        const statusDiv = document.getElementById('onlineStatus');
        if (statusDiv) {
            statusDiv.className = `online-status ${isOnline ? '' : 'offline-status'}`;
            statusDiv.innerHTML = isOnline ? '<i class="fas fa-wifi"></i> Online' : '<i class="fas fa-wifi-slash"></i> Offline Mode';
        }
        
        if (!isOnline) {
            showToast("You are offline. Using cached data.", false);
        } else {
            syncPendingData();
        }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    async function syncPendingData() {
        const pendingTransfers = JSON.parse(localStorage.getItem('pendingTransfers') || '[]');
        if (pendingTransfers.length > 0) {
            showToast(`Syncing ${pendingTransfers.length} pending transfers...`);
            for (const transfer of pendingTransfers) {
                try {
                    const result = await apiCall("updateUnits", { rowIndex: transfer.rowIndex, addUnits: transfer.units });
                    if (result.success) {
                        const updated = pendingTransfers.filter(t => t.id !== transfer.id);
                        localStorage.setItem('pendingTransfers', JSON.stringify(updated));
                    }
                } catch (e) {
                    console.error("Sync failed:", e);
                }
            }
            location.reload();
        }
    }

    // Service Worker registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(registration => {
                console.log('ServiceWorker registered');
            }).catch(err => {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
    }

    async function requestNotificationPermission() {
        if ('Notification' in window) {
            await Notification.requestPermission();
        }
    }

    function sendLocalNotification(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: body });
        }
    }

    // ==================== TELEGRAM CONFIGURATION ====================
    const TELEGRAM_BOT_TOKEN = "8786753893:AAEnCBeMrSPqAyrX-7PXXPuVHz79YrEwvZQ";
    const TELEGRAM_BOT_USERNAME = "jamiisim2bot";
    const TELEGRAM_API_URL = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
    
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbx-ggpKM1cMYW48ojsD3wuy8vkyJP4sLe31KDi4w8sF559e22i8ZvVFydnooGu4lnpQ/exec";
    
    let currentCustomer = null;
    let customerTills = [];
    let transferHistory = [];
    let totalUnitsReceived = 0;
    let transactionCount = 0;
    let currentTab = "tills";

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#fee2e2' : 'white';
        toast.style.color = isError ? '#dc2626' : '#1e4a3b';
        toast.style.borderLeftColor = isError ? '#dc2626' : '#2c7a5e';
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
        
        if (!isError && message.includes("added")) {
            sendLocalNotification("JamiiSim Update", message);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function normalizePhone(phone) {
        if (!phone) return "";
        let normalized = String(phone).replace(/\D/g, '');
        if (normalized.startsWith('254')) normalized = normalized.substring(3);
        else if (normalized.startsWith('0')) normalized = normalized.substring(1);
        return normalized;
    }
    
    async function apiCall(action, params = {}) {
        let url = `${API_BASE_URL}?action=${action}`;
        Object.keys(params).forEach(key => {
            if (params[key] !== undefined && params[key] !== null && params[key] !== "") {
                url += `&${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`;
            }
        });
        
        try {
            const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data;
        } catch (err) {
            console.error("API Error:", err);
            return { success: false, error: err.message };
        }
    }

    async function sendTelegramMessage(chatId, message) {
        if (!TELEGRAM_BOT_TOKEN) return { success: false };
        
        try {
            const response = await fetch(`${TELEGRAM_API_URL}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'HTML'
                })
            });
            const data = await response.json();
            return { success: data.ok };
        } catch (err) {
            return { success: false };
        }
    }
    
    async function getChatIdFromUsername(username) {
        const cleanUsername = username.replace('@', '');
        
        try {
            const response = await fetch(`${TELEGRAM_API_URL}/getUpdates`);
            const data = await response.json();
            
            if (data.ok && data.result) {
                for (const update of data.result) {
                    const message = update.message;
                    if (message && message.chat && message.from) {
                        const msgUsername = message.from.username;
                        const chatId = message.chat.id;
                        
                        if (msgUsername && msgUsername.toLowerCase() === cleanUsername.toLowerCase()) {
                            return { success: true, chatId: chatId };
                        }
                    }
                }
            }
            return { success: false };
        } catch (err) {
            return { success: false };
        }
    }

    async function handleLogin() {
        const phone = document.getElementById("customerPhone").value.trim();
        const pin = document.getElementById("customerPin").value;
        const errorDiv = document.getElementById("loginError");
        
        if (!phone || !pin) {
            errorDiv.innerHTML = "Please enter phone number and PIN";
            return;
        }
        
        errorDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Verifying...';
        
        const linesResult = await apiCall("getLines");
        const customers = linesResult.lines || [];
        const customer = customers.find(c => normalizePhone(c.phone) === normalizePhone(phone));
        
        if (customer) {
            const idString = String(customer.idNumber);
            const idLast4 = idString.slice(-4);
            
            if (pin === idLast4) {
                currentCustomer = customer;
                await loadCustomerData();
                
                const telegramData = getTelegramUsername();
                if (telegramData && telegramData.chatId) {
                    await notifyLogin();
                }
                
                renderDashboard();
                showToast(`Welcome ${customer.name}!`);
                return;
            }
        }
        
        errorDiv.innerHTML = "Invalid phone number or PIN. Try: 0712345678 / 5678";
    }

    async function handleTransferIn() {
        const tillSelect = document.getElementById("transferTill");
        const selectedOption = tillSelect.options[tillSelect.selectedIndex];
        const tillNumber = tillSelect.value;
        const rowIndex = selectedOption?.dataset.row;
        const currentUnits = parseInt(selectedOption?.dataset.currentUnits || 0);
        const senderPhone = document.getElementById("senderPhone").value.trim();
        const units = parseInt(document.getElementById("transferUnits").value);
        const reason = document.getElementById("transferReason")?.value.trim() || "Unit top-up";
        const feedback = document.getElementById("transferFeedback");
        
        if (!tillNumber || !units || units <= 0) {
            feedback.style.display = "block";
            feedback.innerHTML = 'Please select a till and enter valid units';
            feedback.className = "feedback-message feedback-error";
            return;
        }
        
        feedback.style.display = "block";
        feedback.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...';
        feedback.className = "feedback-message";
        
        if (!isOnline) {
            const pendingTransfer = { id: Date.now(), rowIndex: rowIndex, units: units, tillNumber: tillNumber };
            const pending = JSON.parse(localStorage.getItem('pendingTransfers') || '[]');
            pending.push(pendingTransfer);
            localStorage.setItem('pendingTransfers', JSON.stringify(pending));
            
            const tillIndex = customerTills.findIndex(t => t.tillNumber === tillNumber);
            if (tillIndex !== -1) customerTills[tillIndex].units += units;
            
            const transferRecord = { id: Date.now(), tillNumber: tillNumber, fromPhone: senderPhone, units: units, reason: reason, date: new Date().toISOString(), pending: true };
            transferHistory.unshift(transferRecord);
            localStorage.setItem(`transfers_in_${currentCustomer.phone}`, JSON.stringify(transferHistory));
            
            totalUnitsReceived += units;
            transactionCount = transferHistory.length;
            
            feedback.innerHTML = `✓ Added ${units} units (Offline). Will sync when online.`;
            feedback.className = "feedback-message feedback-success";
            document.getElementById("transferUnits").value = "";
            renderDashboard();
            return;
        }
        
        const updateRes = await apiCall("updateUnits", { rowIndex: parseInt(rowIndex), addUnits: units });
        
        if (updateRes.success) {
            const tillIndex = customerTills.findIndex(t => t.tillNumber === tillNumber);
            if (tillIndex !== -1) customerTills[tillIndex].units += units;
            
            const transferRecord = { id: Date.now(), tillNumber: tillNumber, fromPhone: senderPhone, units: units, reason: reason, date: new Date().toISOString() };
            transferHistory.unshift(transferRecord);
            localStorage.setItem(`transfers_in_${currentCustomer.phone}`, JSON.stringify(transferHistory));
            
            if (customerTelegramId) await notifyTransfer(tillNumber, units, currentUnits + units, senderPhone);
            
            totalUnitsReceived += units;
            transactionCount = transferHistory.length;
            
            feedback.innerHTML = `✓ Success! Added ${units} units. New balance: ${currentUnits + units} units`;
            feedback.className = "feedback-message feedback-success";
            document.getElementById("transferUnits").value = "";
            showToast(`Added ${units} units successfully!`);
            renderDashboard();
        } else {
            feedback.innerHTML = `Failed: ${updateRes.error}`;
            feedback.className = "feedback-message feedback-error";
        }
    }
    
    async function handleSaveTelegram() {
        const username = document.getElementById("telegramUsername").value.trim();
        if (!username) { showToast("Please enter your Telegram username", true); return; }
        
        const cleanUsername = username.replace('@', '');
        showToast("Verifying...");
        
        const result = await getChatIdFromUsername(cleanUsername);
        if (result.success && result.chatId) {
            saveTelegramUsername(cleanUsername, result.chatId);
            await sendTelegramMessage(result.chatId, `🎉 Welcome! You'll now receive JamiiSim notifications.`);
            showToast(`✅ Connected to @${cleanUsername}`);
            renderDashboard();
        } else {
            showToast(`❌ Send a message to @${TELEGRAM_BOT_USERNAME} first`, true);
        }
    }
    
    function downloadStatement() {
        const totalUnits = customerTills.reduce((sum, t) => sum + (t.units || 0), 0);
        let html = `<!DOCTYPE html><html><head><title>Statement</title><style>body{font-family:Arial;padding:2rem;}th{background:#1e4a3b;color:white;padding:8px;}td{padding:8px;border-bottom:1px solid #ddd;}</style></head><body>
            <h1>JamiiSim Account Statement</h1>
            <p><strong>Name:</strong> ${currentCustomer.name}</p>
            <p><strong>Phone:</strong> ${currentCustomer.phone}</p>
            <p><strong>Date:</strong> ${new Date().toLocaleString()}</p>
            <h3>Summary</h3>
            <p>Tills: ${customerTills.length} | Units: ${totalUnits} | Received: ${totalUnitsReceived}</p>
            <h3>Tills</h3>
            <table><tr><th>Till</th><th>Store</th><th>Units</th><th>Status</th></tr>
            ${customerTills.map(t => `<tr><td>${t.tillNumber}</td><td>${t.storeNumber}</td><td>${t.units || 0}</td><td>${t.status}</td></tr>`).join('')}</table>
            <h3>Transactions</h3>
            <table><tr><th>Date</th><th>From</th><th>Units</th><th>Reason</th></tr>
            ${transferHistory.map(t => `<tr><td>${new Date(t.date).toLocaleString()}</td><td>${t.fromPhone}</td><td>+${t.units}</td><td>${t.reason}</td></tr>`).join('')}</table>
            </body></html>`;
        
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `JamiiSim_Statement_${currentCustomer.phone}.html`;
        a.click();
        URL.revokeObjectURL(blob);
        showToast("Statement downloaded!");
    }
    
    function initMobileMenu() {
        const existingToggle = document.querySelector('.mobile-menu-toggle');
        const existingOverlay = document.querySelector('.mobile-overlay');
        if (existingToggle) existingToggle.remove();
        if (existingOverlay) existingOverlay.remove();
        
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'mobile-menu-toggle';
        toggleBtn.innerHTML = '<i class="fas fa-bars"></i>';
        toggleBtn.onclick = () => {
            const sidebar = document.querySelector('.portal-sidebar');
            const overlay = document.querySelector('.mobile-overlay');
            if (mobileMenuOpen) {
                sidebar?.classList.remove('open');
                overlay?.classList.remove('show');
                toggleBtn.innerHTML = '<i class="fas fa-bars"></i>';
                mobileMenuOpen = false;
            } else {
                sidebar?.classList.add('open');
                overlay?.classList.add('show');
                toggleBtn.innerHTML = '<i class="fas fa-times"></i>';
                mobileMenuOpen = true;
            }
        };
        document.body.appendChild(toggleBtn);
        
        const overlay = document.createElement('div');
        overlay.className = 'mobile-overlay';
        overlay.onclick = () => {
            document.querySelector('.portal-sidebar')?.classList.remove('open');
            overlay.classList.remove('show');
            toggleBtn.innerHTML = '<i class="fas fa-bars"></i>';
            mobileMenuOpen = false;
        };
        document.body.appendChild(overlay);
    }
    
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('[id$="Content"]').forEach(el => el.style.display = 'none');
        document.getElementById(`${tab}Content`).style.display = 'block';
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.tab === tab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (window.innerWidth <= 768) {
            document.querySelector('.portal-sidebar')?.classList.remove('open');
            document.querySelector('.mobile-overlay')?.classList.remove('show');
            document.querySelector('.mobile-menu-toggle').innerHTML = '<i class="fas fa-bars"></i>';
            mobileMenuOpen = false;
        }
    }
    
    function handleLogout() {
        isLoggingOut = true;
        currentCustomer = null;
        customerTills = [];
        transferHistory = [];
        customerTelegramId = null;
        customerTelegramUsername = null;
        showToast("Logged out successfully");
        renderLogin();
        document.getElementById("loginBtn")?.addEventListener("click", handleLogin);
    }
    
    function render() {
        const app = document.getElementById("app");
        if (currentCustomer && !isLoggingOut) {
            renderDashboard();
        } else {
            isLoggingOut = false;
            app.innerHTML = renderLogin();
            document.getElementById("loginBtn")?.addEventListener("click", handleLogin);
        }
    }
    
    requestNotificationPermission();
    updateOnlineStatus();
    render();
</script>
</body>
</html>
